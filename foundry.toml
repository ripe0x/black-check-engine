[profile.default]
remappings = [
    "forge-std/=lib/forge-std/src/",
    "solady/=lib/solady/src/",
    "shapes/=lib/shapes/src/",
    "ladder/=lib/shapes/ladders/mainnet/",
    "@openzeppelin/contracts/=lib/shapes/lib/openzeppelin-contracts/contracts/",
    "@uniswap/v4-core/=lib/v4-core/",
    "v4-core/=lib/v4-core/src/",
    "@uniswap/v4-periphery/=lib/v4-periphery/",
    "packs/=lib/shape-packs/src/",
]
auto_detect_remappings = false
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
cbor_metadata = false
gas_limit = "18446744073709551615"
fs_permissions = [{ access = "read", path = "./out" }, { access = "read-write", path = "./deployments" }, { access = "read", path = "./script/env" }, { access = "read-write", path = "./docs/receipts" }, { access = "read-write", path = "./sim/data" }]
no_storage_caching = false
# Draw Packs (lib/shape-packs, ripe0x/shape-packs `draw-packs`) is built the way its own repository builds it.
additional_compiler_profiles = [{ name = "packs", via_ir = true, optimizer_runs = 20 }]
compilation_restrictions = [{ paths = "lib/shape-packs/src/**", via_ir = true, optimizer_runs = 20 }]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 24
depth = 40
fail_on_revert = false

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"

[lint]
lint_on_build = false
