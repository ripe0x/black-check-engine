[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false
auto_detect_remappings = false
remappings = [
    "forge-std/=lib/forge-std/src/",
    "solady/=lib/solady/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]
# Fork tests read MAINNET_RPC_URL (default: the Tenderly public gateway) at the block pinned in test/fork/ForkBase.sol.
gas_limit = "18446744073709551615"

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 32
depth = 50
fail_on_revert = false

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"

[lint]
lint_on_build = false
