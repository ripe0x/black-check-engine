[profile.default]
remappings = [
    "forge-std/=lib/forge-std/src/",
    "solady/=lib/solady/src/",
    "shapes/=lib/shapes/src/",
    "ladder/=lib/shapes/ladders/mainnet/",
    "@openzeppelin/contracts/=lib/shapes/lib/openzeppelin-contracts/contracts/",
    "@uniswap/v4-core/=lib/v4-core/",
    "v4-core/=lib/v4-core/src/",
    "@uniswap/v4-periphery/=lib/v4-periphery/",
    "packs/=lib/shape-packs/src/",
]
auto_detect_remappings = false
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# The Checks pool owner (survival, schedule and desk operations on top of the base's listing logic) fits EIP-170 only
# with the IR pipeline (docs/REBASE_PLAN.md R3 size spike: 27,660 B without, 23,377 B with). The deploy routine imports
# every contract, so the whole system compiles with it (as rc2 did); collection-games compiled without it.
via_ir = true
bytecode_hash = "none"
cbor_metadata = false
gas_limit = "18446744073709551615"
fs_permissions = [{ access = "read", path = "./out" }, { access = "read", path = "./out-fast" }, { access = "read-write", path = "./deployments" }, { access = "read", path = "./script/env" }, { access = "read-write", path = "./docs/receipts" }, { access = "read-write", path = "./sim/data" }]
no_storage_caching = false
# Draw Packs (lib/shape-packs, ripe0x/shape-packs `draw-packs`) is built the way its own repository builds it.
additional_compiler_profiles = [{ name = "packs", via_ir = true, optimizer_runs = 20 }]
compilation_restrictions = [{ paths = "lib/shape-packs/src/**", via_ir = true, optimizer_runs = 20 }]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 24
depth = 40
fail_on_revert = false

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"

[lint]
lint_on_build = false

# Iteration only: the default profile (via-IR, EIP-170 enforced) is the one every recorded result uses. This profile
# compiles without IR so tests can be re-run quickly (forge test does not enforce EIP-170 on deployments; only
# test/unit/Sizes.t.sol does, and it fails under this profile by design); nothing deployed is ever built with it.
[profile.fast]
via_ir = false
out = "out-fast"
cache_path = "cache-fast"
